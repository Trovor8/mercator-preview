<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About us · Mercator</title>
<link rel="icon" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
.ab{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(32px,6vw,90px);padding-top:clamp(56px,8vw,110px);padding-bottom:clamp(56px,8vw,110px);align-items:start}
.ab-img{position:sticky;top:110px}
.ab-img>img{border-radius:14px;aspect-ratio:4/5;object-fit:cover;width:100%}
.ab-img .seal img{width:100%;height:auto;display:block}
.ab-img .seal{position:absolute;left:-24px;bottom:-24px;background:#fff;border-radius:12px;padding:1.2rem;width:200px;box-shadow:0 20px 50px rgba(15,44,82,.15)}
.quote-big{font-family:var(--serif);font-style:italic;font-size:clamp(1.6rem,2.6vw,2.2rem);color:var(--navy);line-height:1.25;border-left:3px solid var(--gold);padding-left:1.4rem;margin:2rem 0}
@media (max-width:900px){.ab{grid-template-columns:1fr}.ab-img{position:relative;top:0}.ab-img .seal{left:12px;bottom:-20px;width:150px}}
</style>
</head>
<body>
<div id="hd-slot"></div>
<main>
  <section class="phero img" style="--bg:url(img/hero-27002199.jpg)">
    <div class="wrap">
      <div class="crumb2"><a id="homeA"></a> / <span id="crumbT"></span></div>
      <div class="kicker" id="kick"></div>
      <h1 id="title"></h1>
    </div>
  </section>
  <section class="trust"><div class="wrap stats" id="stats"></div></section>
  <div class="wrap ab">
    <article class="prose" id="body"></article>
    <div class="ab-img"><img src="img/ls-city.jpg" alt=""><div class="seal"><img src="img/logo.png" alt="Mercator 50 years"></div></div>
  </div>
  <section style="background:#fff;padding-top:0">
    <div class="wrap">
      <div class="brands" style="border-top:0;margin-top:0;padding-top:4rem">
        <figure><img src="img/brand-maklarna.jpg" alt="Portugal Mäklarna"><figcaption id="b1"></figcaption></figure>
        <figure><img src="img/brand-megleren.png" alt="Portugal Megleren"><figcaption id="b2"></figcaption></figure>
        <figure><img src="img/cls.jpg" alt="Câmara de Comércio Luso-Sueca"><figcaption id="b3"></figcaption></figure>
      </div>
    </div>
  </section>
  <section class="band">
    <div class="wrap">
      <h2 id="ctaT"></h2>
      <p id="ctaS"></p>
      <div class="btns"><a class="btn btn-gold" id="ctaA"></a><a class="btn btn-line" id="ctaB"></a></div>
    </div>
  </section>
</main>
<div id="ft-slot"></div>
<script src="i18n.js"></script>
<script src="i18n-property.js"></script>
<script src="i18n-pages.js"></script>
<script src="data/pages.js"></script>
<script src="common.js"></script>
<script>
(function(){
  var esc=M.esc;
  function $(i){return document.getElementById(i)}
  function render(){
    var t=M.T(), B=PAGES.about[M.lang]||PAGES.about.en, h='';
    document.title=t.nav_about+' · Mercator';
    $('kick').textContent=t.a_kicker;$('title').textContent=t.a_title;$('crumbT').textContent=t.nav_about;var hm=$('homeA');hm.textContent=t.home;hm.href=M.link('index.html');
    $('stats').innerHTML=[1,2,3,4].map(function(i){return '<div class="stat"><b>'+esc(t['stat'+i+'_n'])+'</b><span>'+esc(t['stat'+i+'_l'])+'</span></div>'}).join('');
    B.forEach(function(b){ if(b[2]) h+='<p class="quote-big">'+esc(b[1])+'</p>'; else h+='<p>'+esc(b[1])+'</p>' });
    h+='<ul><li>'+esc(t.ab_b1)+'</li><li>'+esc(t.ab_b2)+'</li><li>'+esc(t.ab_b3)+'</li></ul>';
    $('body').innerHTML=h;
    $('b1').textContent=t.br_title;$('b2').textContent=t.br_title;$('b3').textContent=t.br_member;
    $('ctaT').textContent=t.cta_title;$('ctaS').textContent=t.cta_sub;
    $('ctaA').innerHTML=esc(t.cta_look)+' <span class="arrow">→</span>';$('ctaA').href=M.link('contact.html',{mode:'buy'});
    $('ctaB').textContent=t.cta_list;$('ctaB').href=M.link('contact.html',{mode:'sell'});
  }
  M.onLang(render); render();
})();
</script>
</body>
</html>
