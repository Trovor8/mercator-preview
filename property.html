<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercator Real Estate</title>
<meta name="description" content="">
<link rel="icon" href="img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://images.egorealestate.com">
<link rel="stylesheet" href="site.css">
<style>
body{background:#fff}
header{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);color:var(--ink);box-shadow:0 1px 0 var(--line)}
header .logo img{filter:none!important}
main{padding-top:84px}
.crumbs{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;font-size:.82rem;color:var(--muted);padding:1.6rem 0 1.2rem}
.crumbs a{display:inline-flex;gap:.4rem;align-items:center;color:var(--navy);font-weight:600}
.crumbs a:hover{color:var(--gold)}
.crumbs i{font-style:normal;opacity:.4}

/* title */
.ptitle{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;flex-wrap:wrap;padding-bottom:1.6rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem}
.chip{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:.4rem .7rem;border-radius:2px;background:var(--paper);color:var(--navy)}
.chip.sale{background:var(--navy);color:#fff}.chip.rent{background:var(--gold);color:#fff}
.ptitle h1{font-size:clamp(2rem,4vw,3.3rem);color:var(--navy);max-width:22ch}
.ptitle .loc{display:flex;gap:.45rem;align-items:center;color:var(--muted);margin-top:.7rem}
.ptitle .loc svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.6}
.acts{display:flex;gap:.6rem}
.act{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1rem;border:1px solid var(--line);border-radius:var(--r);background:#fff;cursor:pointer;font-size:.86rem;font-weight:600;transition:.2s}
.act:hover{border-color:var(--navy)}
.act svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7}
.act.on svg{fill:#c0392b;stroke:#c0392b}

/* bento gallery */
.bento{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:280px 280px;gap:10px;border-radius:10px;overflow:hidden;position:relative}
.bento button{border:0;padding:0;cursor:zoom-in;overflow:hidden;background:#e9e5dd;position:relative}
.bento button:first-child{grid-row:span 2}
.bento img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1),filter .4s}
.bento button:hover img{transform:scale(1.04)}
.bento:hover button:not(:hover) img{filter:brightness(.82)}
.g-tools{position:absolute;right:16px;bottom:16px;display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.g-tools button{cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border:0;border-radius:999px;padding:.65rem 1.05rem;font-weight:600;font-size:.84rem;color:var(--navy);box-shadow:0 8px 24px rgba(0,0,0,.18);transition:.2s}
.g-tools button:hover{background:var(--navy);color:#fff}
.g-tools svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}

/* facts strip */
.facts{display:flex;align-items:stretch;gap:0;margin:2rem 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.facts .price{padding:1.4rem 1.8rem;background:var(--navy);color:#fff;min-width:260px}
.facts .price b{font-family:var(--serif);font-size:2.3rem;font-weight:500;display:block;line-height:1.05;font-variant-numeric:lining-nums}
.facts .price small{color:var(--gold-2);font-size:.82rem}
.fact{flex:1;padding:1.3rem 1.2rem;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:.3rem;min-width:0}
.fact:first-of-type{border-left:0}
.fact span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.fact b{font-family:var(--serif);font-size:1.6rem;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:.5rem;font-variant-numeric:lining-nums;white-space:nowrap}
.fact b svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.5}
.energy{display:inline-grid;place-items:center;min-width:34px;height:28px;padding:0 .5rem;color:#fff;font-family:var(--sans);font-size:.95rem;font-weight:700;clip-path:polygon(0 0,82% 0,100% 50%,82% 100%,0 100%);padding-right:.9rem}

/* body */
.pbody{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:clamp(32px,5vw,72px);padding:3.5rem 0 5rem;align-items:start}
.blk{padding:2.4rem 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0;padding-top:0}
.blk h2{font-size:clamp(1.7rem,2.6vw,2.2rem);margin:0 0 1.2rem}
.desc{color:#3b4654;font-size:1.02rem;line-height:1.75;position:relative;max-height:17.5em;overflow:hidden;transition:max-height .5s}
.desc p{margin-bottom:1em}
.desc.open{max-height:none}
.desc:not(.open):after{content:"";position:absolute;inset:auto 0 0;height:90px;background:linear-gradient(transparent,#fff)}
.more-btn{margin-top:.6rem;background:none;border:0;border-bottom:1px solid var(--navy);color:var(--navy);font-weight:700;padding:.2rem 0;cursor:pointer}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 2.5rem}
.kv div{display:flex;justify-content:space-between;gap:1rem;padding:.95rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.kv dt{color:var(--muted)}.kv dd{font-weight:600;text-align:right}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.plans button{border:1px solid var(--line);border-radius:8px;background:#fafaf8;padding:10px;cursor:zoom-in;aspect-ratio:4/3;transition:.25s}
.plans button:hover{border-color:var(--gold);box-shadow:0 10px 24px rgba(15,44,82,.1)}
.plans img{width:100%;height:100%;object-fit:contain}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.yt{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;cursor:pointer;border:0;padding:0}
.yt img{width:100%;height:100%;object-fit:cover;opacity:.85;transition:.4s}
.yt:hover img{opacity:1;transform:scale(1.03)}
.yt i{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.yt i:after{content:"";border-left:18px solid var(--navy);border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.map{border-radius:10px;overflow:hidden;height:380px;border:1px solid var(--line);position:relative;background:var(--paper)}
.map iframe{width:100%;height:100%;border:0;filter:saturate(.7) contrast(1.05)}
.map .pin{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:rgba(176,147,90,.22);border:2px solid var(--gold);pointer-events:none}
.note{font-size:.8rem;color:var(--muted);margin-top:.7rem}
.disc{font-size:.8rem;color:var(--muted);background:var(--paper);padding:1rem 1.2rem;border-radius:8px;margin-top:1rem}

/* sidebar */
aside{position:sticky;top:104px;display:grid;gap:1.2rem}
.card2{border:1px solid var(--line);border-radius:12px;padding:1.6rem;background:#fff;box-shadow:0 20px 50px rgba(15,44,82,.07)}
.card2 h3{font-size:1.6rem;color:var(--navy);margin-bottom:.4rem}
.card2 .sub{font-size:.9rem;color:var(--muted);margin-bottom:1.2rem}
.card2 form{background:none;padding:0;grid-template-columns:1fr;gap:.75rem}
.card2 input,.card2 textarea{padding:.75rem .9rem;font-size:.92rem}
.card2 textarea{min-height:90px}
.card2 .btn{width:100%;justify-content:center}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.8rem}
.duo a{display:flex;justify-content:center;align-items:center;gap:.5rem;padding:.8rem;border:1px solid var(--line);border-radius:var(--r);font-weight:600;font-size:.88rem;transition:.2s}
.duo a:hover{border-color:var(--navy)}
.duo a.wa2{background:#25d366;border-color:#25d366;color:#fff}
.duo svg{width:17px;height:17px}
.calc label{display:block;margin-bottom:1rem}
.calc .row{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:.4rem}
.calc .row b{color:var(--navy)}
.calc input[type=range]{width:100%;accent-color:var(--navy);padding:0;border:0}
.calc .out{background:var(--paper);border-radius:8px;padding:1rem 1.1rem;margin-top:.4rem}
.calc .out span{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.calc .out b{display:block;font-family:var(--serif);font-size:2rem;color:var(--navy);font-weight:600;font-variant-numeric:lining-nums}
.calc .stamp{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:.8rem}
.calc .note{margin-top:.8rem}

.similar{background:var(--paper)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:#0b1626;color:#fff;display:none;grid-template-rows:auto 1fr auto}
.lb.open{display:grid}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:16px var(--gut);font-size:.9rem}
.lb-top .cnt{font-variant-numeric:tabular-nums;letter-spacing:.08em;opacity:.8}
.lb-top .t{opacity:.65;max-width:50vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-x{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:999px;padding:.6rem 1rem;cursor:pointer;font-weight:600;display:flex;gap:.4rem;align-items:center}
.lb-x:hover{background:rgba(255,255,255,.2)}
.lb-stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.lb-stage img{max-width:calc(100% - 140px);max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity .35s, transform .35s}
.lb-stage img.ld{opacity:0;transform:scale(.985)}
.lb-stage.plans img{background:#fff;padding:12px;border-radius:6px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;display:grid;place-items:center;transition:.2s}
.lb-nav:hover{background:#fff;color:var(--navy)}
.lb-nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.lb-prev{left:var(--gut)}.lb-next{right:var(--gut)}
.lb-strip{display:flex;gap:8px;overflow-x:auto;padding:14px var(--gut) 18px;scrollbar-width:none}
.lb-strip::-webkit-scrollbar{display:none}
.lb-strip button{flex:none;width:96px;height:64px;border:2px solid transparent;border-radius:6px;overflow:hidden;padding:0;cursor:pointer;opacity:.45;transition:.25s;background:#222}
.lb-strip button.on{opacity:1;border-color:var(--gold-2)}
.lb-strip img{width:100%;height:100%;object-fit:cover}
.lb-progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.08)}
.lb-progress i{display:block;height:100%;background:var(--gold-2);transition:width .35s}

/* grid view */
.gv{position:fixed;inset:0;z-index:90;background:#fff;overflow:auto;display:none}
.gv.open{display:block}
.gv-top{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;padding:16px var(--gut);border-bottom:1px solid var(--line);z-index:2}
.gv-top h3{font-size:1.5rem;color:var(--navy)}
.gv .lb-x{background:var(--paper);color:var(--navy)}
.gv-grid{columns:3 280px;column-gap:10px;padding:20px var(--gut) 40px;max-width:1500px;margin:0 auto}
.gv-grid button{display:block;width:100%;margin-bottom:10px;border:0;padding:0;cursor:zoom-in;border-radius:6px;overflow:hidden;break-inside:avoid;background:#eee}
.gv-grid img{width:100%;height:auto;transition:transform .6s}
.gv-grid button:hover img{transform:scale(1.03)}

.mbar{display:none}
@media (max-width:1080px){
  .pbody{grid-template-columns:1fr}
  aside{position:static}
  .facts{flex-wrap:wrap}
  .facts .price{flex-basis:100%}
  .fact:first-of-type{border-left:0}
}
@media (max-width:760px){
  main{padding-top:70px}
  .bento{grid-template-columns:1fr 1fr;grid-template-rows:260px 120px;border-radius:0;margin:0 calc(var(--gut)*-1)}
  .bento button:first-child{grid-column:span 2;grid-row:auto}
  .bento button:nth-child(n+4){display:none}
  .g-tools{right:12px;bottom:12px}
  .g-tools button{padding:.5rem .8rem;font-size:.78rem}
  .fact{flex:1 1 45%;border-left:0;border-top:1px solid var(--line)}
  .facts .price{min-width:0}
  .kv{grid-template-columns:1fr}
  .acts .act span{display:none}
  .lb-stage img{max-width:100%}
  .lb-nav{display:none}
  .lb-strip button{width:64px;height:46px}
  .wa{display:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));gap:10px;align-items:center;box-shadow:0 -10px 30px rgba(0,0,0,.08)}
  .mbar .p{flex:1;font-family:var(--serif);font-size:1.4rem;font-weight:600;color:var(--navy);line-height:1.1;font-variant-numeric:lining-nums}
  .mbar .p small{display:block;font-family:var(--sans);font-size:.7rem;color:var(--muted);font-weight:500}
  .mbar .btn{padding:.8rem 1rem}
  .mbar .w{width:46px;height:46px;border-radius:var(--r);background:#25d366;display:grid;place-items:center}
  .mbar .w svg{width:22px;height:22px;fill:#fff}
  footer{padding-bottom:110px}
}
</style>
</head>

  var I={bed:'<svg viewBox="0 0 24 24"><path d="M3 18V7M21 18v-5a3 3 0 0 0-3-3H10v8M3 14h18M6.5 11.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>',

         grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',

         heart:'<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
         doc:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',
         phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
         wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.6-.1 1.2z"/></svg>'};

  function pickLang(){
    var q=Q.get('lang'); if(q&&I18N[q])return q;
    var s=store('mercator_lang'); if(s&&I18N[s])return s;
    var n=(navigator.language||'en').slice(0,2).toLowerCase(); if(n==='nb'||n==='nn')n='no';
    return I18N[n]?n:'en';
  }

  function paragraphs(txt,title){
    var lines=txt.split(/\n+/).map(function(s){return s.trim()}).filter(Boolean);
    if(lines.length&&title&&lines[0].replace(/\.$/,'')===title.replace(/\.$/,''))lines.shift();
    return lines.map(function(l){return '<p>'+esc(l)+'</p>'}).join('');
  }

  function render(){
    var t=T();
    document.documentElement.lang=t._html;
    if(P&&!D){$('app').innerHTML='<div style="padding:160px 0;text-align:center;color:var(--muted)">…</div>';return}
    if(!D||!P){$('app').innerHTML='<div style="padding:120px 0;text-align:center"><h1 style="color:var(--navy)">'+esc(t.p_notfound)+'</h1><p style="margin-top:1rem"><a class="btn btn-navy" href="index.html?lang='+lang+'">'+esc(t.p_back)+'</a></p></div>';$('similarSec').style.display='none';return}
    var L=D.t[lang], PL=P.t[lang], rent=P.rent, home='index.html?lang='+lang;
    document.title=L.title+' · Mercator';
    document.querySelector('meta[name=description]').content=L.title+' — '+PL.loc+' — '+money(P.price);
    var saved=(store('mercator_fav')||'').split(',').indexOf(id)>-1;
    var area=D.net||D.gross, ppm=(!rent&&area)?P.price/area:null;
    var crumbs=[D.district,D.mun,D.zone].filter(function(x,i,a){return x&&a.indexOf(x)===i});
    var imgs=D.img, show=imgs.slice(0,5);

    var h='';
    h+='<nav class="crumbs"><a href="'+link('properties.html',P.region?{region:P.region}:{})+'">← '+esc(t.p_back)+'</a><i>/</i>'+crumbs.map(esc).join(' <i>›</i> ')+'</nav>';
    h+='<div class="ptitle"><div><div class="chips">'+(P.sold?'<span class="chip" style="background:#5d6876;color:#fff">'+esc(t.f_sold)+'</span>':'<span class="chip '+(rent?'rent':'sale')+'">'+esc(L.biz)+'</span>')+(P.reserved&&!P.sold?'<span class="chip" style="background:#8a6d3b;color:#fff">'+esc(t.f_reserved)+'</span>':'')+'<span class="chip">'+esc(t.p_ref)+' '+esc(D.ref)+'</span><span class="chip">'+esc(PL.type)+'</span></div>'+
       '<h1>'+esc(L.title)+'</h1><div class="loc">'+I.pin+esc(PL.loc)+'</div></div>'+
       '<div class="acts"><button class="act" id="shareBtn">'+I.share+'<span>'+esc(t.p_share)+'</span></button><button class="act'+(saved?' on':'')+'" id="saveBtn">'+I.heart+'<span>'+esc(saved?t.p_saved:t.p_save)+'</span></button></div></div>';

    h+='<div class="bento">'+show.map(function(u,i){return '<button data-open="'+i+'"><img src="'+img(u,i===0?'ZOriginal':'Z1280x1024')+'" alt="" '+(i?'loading="lazy"':'fetchpriority="high"')+'></button>'}).join('')+
       '<div class="g-tools"><button data-grid>'+I.grid+esc(t.p_show_all.replace('{n}',imgs.length))+'</button>'+
       (D.video.length?'<button data-jump="videoBlk">'+I.play+esc(t.p_video)+'</button>':'')+
       (D.plans.length?'<button data-plans="0">'+I.plan+esc(t.p_plans)+'</button>':'')+'</div></div>';

    h+='<div class="facts"><div class="price"><b>'+money(P.price)+'</b><small>'+(rent?esc(t.per_month):ppm?money(Math.round(ppm))+' '+esc(t.p_ppm):'')+'</small></div>';
    h+='<div class="fact"><span>'+esc(t.p_beds)+'</span><b>'+I.bed+P.beds+'</b></div>';
    h+='<div class="fact"><span>'+esc(t.p_baths)+'</span><b>'+I.bath+P.baths+'</b></div>';
    if(area)h+='<div class="fact"><span>'+esc(t.p_living)+'</span><b>'+I.area+num(area)+' m²</b></div>';
    if(D.land)h+='<div class="fact"><span>'+esc(t.p_plot)+'</span><b>'+I.plot+num(D.land)+' m²</b></div>';
    if(D.energy)h+='<div class="fact"><span>'+esc(t.p_energy)+'</span><b><i class="energy" style="background:'+(ENERGY[D.energy]||'#888')+'">'+esc(D.energy)+'</i></b></div>';
    h+='</div>';

    // body
    h+='<div class="pbody"><div>';
    h+='<div class="blk"><div class="kicker" data-x>'+esc(t.p_about)+'</div><h2 style="margin-top:.7rem">'+esc(PL.type)+'</h2><div class="desc" id="desc">'+paragraphs(L.desc,L.title)+'</div><button class="more-btn" id="moreBtn">'+esc(t.p_more)+'</button></div>';
    var kv=[[t.p_ref,D.ref],[t.p_type,L.type],[t.p_beds,L.rooms||P.beds],[t.p_baths,P.baths],[t.p_living,D.net&&num(D.net,2)+' m²'],[t.p_gross,D.gross&&num(D.gross,2)+' m²'],[t.p_plot,D.land&&num(D.land,2)+' m²'],[t.p_floors,D.floors],[t.p_energy,D.energy],[t.p_cond,L.cond],[t.p_mun,D.mun],[t.p_zone,D.zone||D.parish]];
    h+='<div class="blk"><h2>'+esc(t.p_details)+'</h2><dl class="kv">'+kv.filter(function(r){return r[1]}).map(function(r){return '<div><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>'}).join('')+'</dl></div>';
    if(D.plans.length)h+='<div class="blk"><h2>'+esc(t.p_plans)+'</h2><div class="plans">'+D.plans.map(function(u,i){return '<button data-plans="'+i+'"><img src="'+img(u,'Z512x384')+'" alt="" loading="lazy"></button>'}).join('')+'</div>'+
       (D.brochure.length?'<p style="margin-top:1.2rem"><a class="btn btn-line" href="'+esc(D.brochure[0])+'" target="_blank" rel="noopener" style="color:var(--navy)">'+I.doc.replace('<svg','<svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"')+esc(t.p_brochure)+'</a></p>':'')+'</div>';
    if(D.video.length)h+='<div class="blk" id="videoBlk"><h2>'+esc(t.p_video)+'</h2><div class="vids">'+D.video.map(function(v){return '<button class="yt" data-yt="'+esc(v)+'" aria-label="Play video"><img src="https://i.ytimg.com/vi/'+esc(v)+'/hqdefault.jpg" alt="" loading="lazy"><i></i></button>'}).join('')+'</div></div>';
    if(D.lat&&D.lon){var d=.012,bb=[D.lon-d*1.6,D.lat-d,D.lon+d*1.6,D.lat+d].join(',');
      h+='<div class="blk"><h2>'+esc(t.p_location)+'</h2><div class="map"><iframe loading="lazy" title="Map" src="https://www.openstreetmap.org/export/embed.html?bbox='+bb+'&layer=mapnik"></iframe><span class="pin"></span></div><p class="note">'+esc(t.p_loc_note)+' · '+esc(PL.loc)+'</p></div>';}
    h+='<p class="disc">'+esc(t.p_disclaimer)+'</p>';
    h+='</div>';

    // aside
    h+='<aside><div class="card2" id="book"><h3>'+esc(t.p_book)+'</h3><p class="sub">'+esc(t.p_book_sub)+'</p>'+
       '<form id="bform" novalidate><input name="name" placeholder="'+esc(t.fm_name)+'" autocomplete="name"><input name="email" type="email" placeholder="'+esc(t.fm_email)+'" autocomplete="email"><input name="phone" type="tel" placeholder="'+esc(t.fm_phone)+'" autocomplete="tel">'+
       '<label style="display:block"><small style="font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600">'+esc(t.p_date)+'</small><input name="date" type="date" style="margin-top:.35rem"></label>'+
       '<textarea name="msg">'+esc(t.p_wa_msg.replace('{ref}',D.ref))+'</textarea>'+
       '<label class="consent"><input type="checkbox" name="ok"><span>'+t.fm_consent.replace('{terms}',link('legal.html',{doc:'terms'})).replace('{privacy}',link('legal.html',{doc:'privacy'})).replace(/ target="_blank" rel="noopener"/g,'')+'</span></label>'+
       '<p class="ferr" id="bErr">'+esc(t.fm_err)+'</p><button class="btn btn-navy" type="submit">'+esc(t.p_send)+' <span class="arrow">→</span></button></form>'+
       '<div class="duo"><a class="wa2" href="'+wa()+'" target="_blank" rel="noopener">'+I.wa+esc(t.p_wa)+'</a><a href="tel:+351214658650">'+I.phone+esc(t.p_call)+'</a></div></div>';
    if(!rent)h+='<div class="card2 calc"><h3>'+esc(t.p_mort)+'</h3><p class="sub"></p>'+
       '<label><div class="row"><span>'+esc(t.p_mort_loan)+'</span><b id="cLoanV"></b></div><input type="range" id="cLoan" min="10" max="80" step="5" value="70"></label>'+
       '<label><div class="row"><span>'+esc(t.p_mort_rate)+'</span><b id="cRateV"></b></div><input type="range" id="cRate" min="1" max="7" step="0.1" value="3.5"></label>'+
       '<label><div class="row"><span>'+esc(t.p_mort_years)+'</span><b id="cYearsV"></b></div><input type="range" id="cYears" min="5" max="40" step="1" value="30"></label>'+
       '<div class="out"><span>'+esc(t.p_mort_month)+'</span><b id="cOut"></b></div>'+
       '<div class="stamp"><span>'+esc(t.p_stamp)+'</span><b>'+money(Math.round(P.price*.008))+'</b></div>'+
       '<p class="note">'+esc(t.p_mort_note)+' <a href="'+link('guide.html')+'" style="text-decoration:underline">'+esc(t.nav_guide)+'</a></p></div>';
    h+='</aside></div>';
    $('app').innerHTML=h;

    // mobile bar + float
    $('mbar').innerHTML='<div class="p">'+money(P.price)+'<small>'+(rent?esc(t.per_month):esc(PL.type))+'</small></div><a class="btn btn-navy" href="#book">'+esc(t.p_send)+'</a><a class="w" href="'+wa()+'" target="_blank" rel="noopener" aria-label="WhatsApp">'+I.wa.replace('fill="currentColor"','')+'</a>';
    $('waFloat').href=wa();

    // similar
    var sim=PROPS.filter(function(p){return p.id!==id&&p.rent===rent&&!p.sold}).sort(function(a,b){return (b.region===P.region)-(a.region===P.region)||Math.abs(a.price-P.price)-Math.abs(b.price-P.price)}).slice(0,3);
    $('similar').innerHTML=sim.map(function(p){var x=p.t[lang];return '<a class="card" href="'+link('property.html',{id:p.id})+'"><div class="ph"><img src="'+img(p.im[0],'Z1280x1024')+'" alt="" loading="lazy"><span class="badge'+(p.rent?' rent':'')+'">'+esc(p.rent?t.f_rent:t.f_sale)+'</span></div><div class="body"><div class="loc">'+esc(x.loc)+'</div><h3>'+esc(x.title)+'</h3><div class="ref">Ref. '+esc(p.ref)+'</div><div class="meta"><span>'+I.bed+p.beds+'</span><span>'+I.bath+p.baths+'</span><span class="price">'+money(p.price)+(p.rent?' <small>'+esc(t.per_month)+'</small>':'')+'</span></div></div></a>'}).join('');

    calc();
  }

  function calc(){
    if(!$('cLoan'))return;
    var pct=+$('cLoan').value, r=+$('cRate').value/100/12, n=+$('cYears').value*12, L=P.price*pct/100;
    var m=r?L*r/(1-Math.pow(1+r,-n)):L/n;
    $('cLoanV').textContent=money(Math.round(L))+' · '+pct+'%';
    $('cRateV').textContent=num(+$('cRate').value,1)+'%';
    $('cYearsV').textContent=$('cYears').value+' '+T().p_years;
    $('cOut').textContent=money(Math.round(m))+' '+T().per_month;
  }

  function chrome(){
    var t=T();
    $('langCode').textContent=lang.toUpperCase();
    $('langMenu').innerHTML=ORDER.map(function(k){return '<button role="menuitem" data-lang="'+k+'" aria-current="'+(k===lang)+'">'+I18N[k]._name+'<span>'+k.toUpperCase()+'</span></button>'}).join('');
    document.querySelectorAll('[data-t]').forEach(function(el){var v=t[el.getAttribute('data-t')];if(v!=null)el.innerHTML=v});
    document.querySelectorAll('[data-home]').forEach(function(a){var h=a.getAttribute('data-home');a.href=({'#properties':link('properties.html'),'#guide':link('guide.html'),'#about':link('about.html'),'#contact':link('contact.html')})[h]||('index.html?lang='+lang+h)});
    $('homeLogo').href='index.html?lang='+lang;
    $('lgTerms').href=link('legal.html',{doc:'terms'});$('lgPrivacy').href=link('legal.html',{doc:'privacy'});
  }

  function setLang(k){
    lang=k;store('mercator_lang',k);
    try{var u=new URL(location.href);u.searchParams.set('lang',k);history.replaceState(null,'',u)}catch(e){}
    chrome();render();$('langMenu').classList.remove('open');
  }

  /* ---------- lightbox ---------- */
  function openLB(kind,i){
    setKind=kind; set=kind==='plans'?D.plans:D.img; idx=i;
    $('lbStage').classList.toggle('plans',kind==='plans');
    $('lbStrip').innerHTML=set.map(function(u,j){return '<button data-i="'+j+'"><img src="'+img(u,'Z512x384')+'" alt="" loading="lazy"></button>'}).join('');
    $('lbT').textContent=D.t[lang].title;
    $('lb').classList.add('open');document.body.style.overflow='hidden';
    show(0);
  }
  function show(dir){
    var el=$('lbImg'), u=img(set[idx],'ZOriginal');
    el.classList.add('ld');
    var pre=new Image();pre.onload=pre.onerror=function(){el.src=u;el.classList.remove('ld')};pre.src=u;
    [idx+1,idx-1].forEach(function(j){if(set[j]){var p=new Image();p.src=img(set[j],'ZOriginal')}});
    $('lbCnt').textContent=(idx+1)+' / '+set.length;
    $('lbBar').style.width=((idx+1)/set.length*100)+'%';
    document.querySelectorAll('#lbStrip button').forEach(function(b,j){b.classList.toggle('on',j===idx);if(j===idx)b.scrollIntoView({block:'nearest',inline:'center',behavior:dir?'smooth':'auto'})});
  }
  function go(d){idx=(idx+d+set.length)%set.length;show(d)}
  function closeLB(){$('lb').classList.remove('open');if(!$('gv').classList.contains('open'))document.body.style.overflow=''}
  function openGrid(){
    $('gvT').textContent=T().p_show_all.replace('{n}',D.img.length);
    $('gvGrid').innerHTML=D.img.map(function(u,i){return '<button data-open="'+i+'"><img src="'+img(u,'Z1280x1024')+'" alt="" loading="lazy"></button>'}).join('');
    $('gv').classList.add('open');document.body.style.overflow='hidden';$('gv').scrollTop=0;
  }

  // touch swipe
  var sx=null;
  $('lbStage').addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  $('lbStage').addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(dx<0?1:-1);sx=null});

  document.addEventListener('click',function(e){
    var b;
    if((b=e.target.closest('[data-lang]')))return setLang(b.getAttribute('data-lang'));
    if(e.target.closest('#langBtn')){$('langMenu').classList.toggle('open');return}
    if(!e.target.closest('.langs'))$('langMenu').classList.remove('open');
    if((b=e.target.closest('[data-open]')))return openLB('img',+b.getAttribute('data-open'));
    if((b=e.target.closest('[data-plans]')))return openLB('plans',+b.getAttribute('data-plans'));
    if(e.target.closest('[data-grid]'))return openGrid();
    if((b=e.target.closest('[data-jump]')))return $(b.getAttribute('data-jump')).scrollIntoView({behavior:'smooth',block:'start'});
    if((b=e.target.closest('#lbStrip [data-i]'))){idx=+b.getAttribute('data-i');return show(1)}
    if(e.target.closest('#lbPrev'))return go(-1);
    if(e.target.closest('#lbNext'))return go(1);
    if(e.target.closest('#lbX'))return closeLB();
    if(e.target.closest('#gvX')){$('gv').classList.remove('open');document.body.style.overflow='';return}
    if((b=e.target.closest('.yt'))&&!b.querySelector('iframe')){b.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(b.getAttribute('data-yt'))+'?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="Video"></iframe>';return}
    if(e.target.closest('#moreBtn')){var d=$('desc'),o=d.classList.toggle('open');e.target.textContent=o?T().p_less:T().p_more;return}
    if(e.target.closest('#saveBtn')){
      var f=(store('mercator_fav')||'').split(',').filter(Boolean),i=f.indexOf(id);
      if(i>-1)f.splice(i,1);else f.push(id);store('mercator_fav',f.join(','));
      var on=i<0,btn=$('saveBtn');btn.classList.toggle('on',on);btn.querySelector('span').textContent=on?T().p_saved:T().p_save;return}
    if(e.target.closest('#shareBtn')){
      var data={title:D.t[lang].title,url:location.href};
      if(navigator.share){navigator.share(data).catch(function(){})}
      else if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(function(){var s=$('shareBtn').querySelector('span');s.textContent=T().p_copied;setTimeout(function(){s.textContent=T().p_share},1800)})}
      return}
  });
  document.addEventListener('input',function(e){if(e.target.closest('.calc'))calc()});
  document.addEventListener('keydown',function(e){
    if($('lb').classList.contains('open')){if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key==='Escape')closeLB();return}
    if(e.key==='Escape'){$('gv').classList.remove('open');document.body.style.overflow='';$('langMenu').classList.remove('open')}
  });
  document.addEventListener('submit',function(e){
    if(e.target.id!=='bform')return;e.preventDefault();
    var f=e.target,t=T();
    if(!f.name.value.trim()||!/^\S+@\S+\.\S+$/.test(f.email.value)||!f.ok.checked){$('bErr').style.display='block';return}
    $('bErr').style.display='none';
    var body=t.fm_name+': '+f.name.value+'\n'+t.fm_email+': '+f.email.value+'\n'+t.fm_phone+': '+f.phone.value+'\n'+t.p_date+': '+(f.date.value||'—')+'\n'+t.lang_label+': '+t._name+'\n'+t.p_ref+': '+D.ref+'\n'+location.href+'\n\n'+f.msg.value;
    location.href='mailto:mercator@mercator.pt?subject='+encodeURIComponent(t.p_subject.replace('{ref}',D.ref))+'&body='+encodeURIComponent(body);
  });

  lang=pickLang(); chrome(); render();
  if(P){var s=document.createElement('script');s.src='data/p/'+id+'.js';s.onerror=function(){P=null;render()};document.body.appendChild(s)}
})();
</script>
